name: MakeCode Arcade Release

on: 
  release:
    types:
      - created

jobs:
  build:
    runs-on: self-hosted
    # Fixes the "Resource not accessible by integration" error
    permissions:
      contents: write 

    defaults:
      run:
        shell: pwsh

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install MakeCode
        run: |
          npm install -g pxt
          pxt target arcade

      - name: Build JS
        run: |
          pxt clean
          pxt install
          pxt build --cloud

      - name: Build D51
        continue-on-error: true
        run: |
          pxt clean
          pxt install --hw samd51
          pxt build --hw samd51 --cloud
          Copy-Item ./built/binary.uf2 binary-d51.uf2

      - name: Build F4
        continue-on-error: true
        run: |
          pxt clean
          pxt install --hw stm32f401
          pxt build --hw stm32f401 --cloud
          Copy-Item ./built/binary.uf2 binary-f4.uf2

      - name: Build P0
        continue-on-error: true
        run: |
          pxt clean
          pxt install --hw rpi
          pxt build --hw rpi --cloud
          Copy-Item ./built/binary.uf2 binary-p0.uf2

      - name: Bundle all
        # Concatenates binary files safely using PowerShell 7 syntax
        run: |
          Get-Content binary-*.uf2 -AsByteStream -Raw | Set-Content ./built/arcade.uf2 -AsByteStream

      - name: Upload bundled
        # Replaced deprecated upload action with the modern standard
        uses: softprops/action-gh-release@v2
        with:
          files: ./built/arcade.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
